# Synthetic SPEC CPU2017-style config file, hand-constructed for
# tests/test_audit_flags_from_spec_results.py -- NOT a captured excerpt of any real
# published SPEC result. CLAUDE.md's "never commit SPEC-licensed content" rule covers
# other parties' published disclosures the same as it covers benchmark source, so this
# fixture deliberately mirrors real CPU2017 cfg syntax (helper-variable factoring,
# $(VAR) references, --param usage, backslash line continuation -- all confirmed live
# against an actual published .cfg during development) without redistributing anyone's
# actual submission.

CC                      = gcc -m64 -std=gnu11
CXX                     = g++ -m64 -std=gnu++17
FC                      = gfortran -m64

CC_VERSION_OPTION       = --version

FAST_BASE               = -O3 -march=native -funroll-loops \
                          -fprefetch-loop-arrays --param prefetch-latency=300

COPTIMIZE               = $(FAST_BASE) -mtune=native -fno-plt -DSPEC_LP64
CXXOPTIMIZE             = $(FAST_BASE) -flto -fprofile-use
FOPTIMIZE               = -O3 -march=native -fstack-arrays -ffree-line-length-none

EXTRA_CFLAGS            = $(SITE_SPECIFIC_FLAGS) -fno-semantic-interposition

PORTABILITY             = -DSPEC_LINUX_X64
